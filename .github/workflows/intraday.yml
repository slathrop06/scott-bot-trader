name: intraday-run

on:
  # Brute-force coverage of both slots (mid ~11 ET, late ~1:30 ET). Every 10
  # minutes from 15:00 to 18:55 UTC weekdays — covers EDT and EST. The script
  # infers the slot from current ET hour; each slot has its own idempotency
  # guard (intraday_mid_attempt / intraday_late_attempt), so once a slot
  # completes, subsequent ticks for that slot no-op.
  schedule:
    - cron: "*/10 15-18 * * 1-5"
  push:
    branches: [main]
    paths: [".triggers/intraday"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: scott-bot-trader
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat — prove the workflow started
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import date, datetime, timezone
          from pathlib import Path
          p = Path("data/trades.json")
          log = json.loads(p.read_text()) if p.exists() else []
          log.append({
              "type": "infra_attempt",
              "date": date.today().isoformat(),
              "ts": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "status": "intraday_workflow_started",
              "note": f"event={os.environ.get('GITHUB_EVENT_NAME','?')} run_id={os.environ.get('GITHUB_RUN_ID','?')}",
          })
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(log, indent=2))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run intraday picker
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TRADING_MODE: paper
        run: python scripts/intraday_run.py

      - name: Commit trade log
        if: always()
        run: |
          if [ ! -f data/trades.json ]; then
            echo "No trades.json — nothing to commit."
            exit 0
          fi
          git config user.name "scott-bot-trader"
          git config user.email "bot@scottbotpicks.com"
          git add data/trades.json data/account.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "intraday run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
