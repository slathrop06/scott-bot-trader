name: morning-run

on:
  # Brute-force cron coverage. GHA scheduled workflows silently skip during
  # peak load — happened 3 days in a row at the 9:35 ET slot. Strategy: fire
  # every 10 minutes from 13:00 to 14:55 UTC weekdays. The script's
  # idempotency guard (tracker.already_completed_today) makes only the first
  # successful tick trade; the rest no-op cleanly. 12 ticks/morning ≈ 0%
  # chance GHA skips ALL of them.
  schedule:
    - cron: "*/10 13-14 * * 1-5"
  push:
    branches: [main]
    paths: [".triggers/morning"]
  workflow_dispatch: {}

permissions:
  contents: write  # needed to auto-commit data/trades.json

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: scott-bot-trader
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Heartbeat — prove the workflow started
        # Runs before setup-python/pip so an 'infra_attempt' row is recorded
        # even if dep install breaks. Distinguishes cron-didn't-fire (no row)
        # from cron-fired-but-deps-broke (row exists, no morning_attempt:started).
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import date, datetime, timezone
          from pathlib import Path
          p = Path("data/trades.json")
          log = json.loads(p.read_text()) if p.exists() else []
          log.append({
              "type": "infra_attempt",
              "date": date.today().isoformat(),
              "ts": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "status": "workflow_started",
              "note": f"event={os.environ.get('GITHUB_EVENT_NAME','?')} run_id={os.environ.get('GITHUB_RUN_ID','?')}",
          })
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(log, indent=2))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps (with retry, fall back to no-cache)
        run: |
          set +e
          pip install -r requirements.txt && exit 0
          echo "First pip install failed — sleeping 5s and retrying..."
          sleep 5
          pip install -r requirements.txt && exit 0
          echo "Second pip install failed — purging cache and retrying with --no-cache-dir..."
          pip cache purge || true
          pip install --no-cache-dir -r requirements.txt

      - name: Mark deps installed
        # Writes a 'deps_ready' row so we know whether pip install completed
        # vs. the script itself failed. Combined with the earlier heartbeat
        # and morning_attempt:started rows this isolates the failure point.
        run: |
          python3 - <<'PY'
          import json
          from datetime import date, datetime, timezone
          from pathlib import Path
          p = Path("data/trades.json")
          log = json.loads(p.read_text()) if p.exists() else []
          log.append({
              "type": "infra_attempt",
              "date": date.today().isoformat(),
              "ts": datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
              "status": "deps_ready",
              "note": "pip install completed",
          })
          p.write_text(json.dumps(log, indent=2))
          PY

      - name: Import smoke test (capture errors to trades.json)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TRADING_MODE: paper
        run: |
          python3 - <<'PY'
          import json, sys, traceback
          from datetime import date, datetime, timezone
          from pathlib import Path
          p = Path("data/trades.json")
          log = json.loads(p.read_text()) if p.exists() else []
          try:
              import sys as _s
              _s.path.insert(0, ".")
              from src import account, altdata, data, earnings, news, picker, safety, trader, tracker
              log.append({
                  "type": "infra_attempt",
                  "date": date.today().isoformat(),
                  "ts": datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
                  "status": "imports_ok",
                  "note": "src.* all importable",
              })
              p.write_text(json.dumps(log, indent=2))
          except Exception as e:
              tb = traceback.format_exc()
              log.append({
                  "type": "infra_attempt",
                  "date": date.today().isoformat(),
                  "ts": datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
                  "status": "imports_failed",
                  "note": f"{type(e).__name__}: {e}"[:200],
              })
              log.append({
                  "type": "infra_attempt",
                  "date": date.today().isoformat(),
                  "ts": datetime.now(timezone.utc).isoformat().replace("+00:00","Z"),
                  "status": "imports_traceback",
                  "note": tb.replace("\n", " | ")[:400],
              })
              p.write_text(json.dumps(log, indent=2))
              sys.exit(1)
          PY

      - name: Run morning picker
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TRADING_MODE: paper
        run: python scripts/morning_run.py

      - name: Commit trade log
        if: always()
        run: |
          if [ ! -f data/trades.json ]; then
            echo "No trades.json — nothing to commit."
            exit 0
          fi
          git config user.name "scott-bot-trader"
          git config user.email "bot@scottbotpicks.com"
          git add data/trades.json
          if git diff --cached --quiet; then
            echo "No changes to trades.json — skipping commit."
          else
            git commit -m "morning run $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
