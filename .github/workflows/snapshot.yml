name: account-snapshot

on:
  # Brute-force snapshot coverage. Every 30 minutes from 13:00 to 21:30 UTC
  # weekdays. The commit step only commits if account.json actually changed,
  # so most overnight/holiday ticks are silent. Frequent snapshots keep the
  # dashboard's "current balance" within 30 min of reality during market hours.
  schedule:
    - cron: "*/30 13-21 * * 1-5"
  push:
    branches: [main]
    paths: [".triggers/snapshot"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency:
      group: scott-bot-trader
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Snapshot account
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TRADING_MODE: paper
        run: python scripts/snapshot_account.py

      - name: Commit account snapshot
        if: always()
        run: |
          if [ ! -f data/account.json ]; then
            echo "No account.json — nothing to commit."
            exit 0
          fi
          git config user.name "scott-bot-trader"
          git config user.email "bot@scottbotpicks.com"
          git add data/account.json
          if git diff --cached --quiet; then
            echo "No changes to account.json — skipping commit."
          else
            git commit -m "account snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
